<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><style>
[data-wq-row]{border-radius:10px;transition:background .15s ease,transform .15s ease}[data-wq-row]:hover{transform:translateX(2px)}

@media (max-width:1100px){[data-wq-row]{grid-template-columns:28px minmax(0,1fr) 132px !important;grid-template-areas:"n main act" "n meta act" !important}[data-wq-main]{grid-area:main}[data-wq-meta]{display:flex !important;grid-area:meta;gap:16px;flex-wrap:wrap}[data-wq-act]{grid-area:act}[data-wq-n]{grid-area:n}[data-wq-head]{display:none !important}}
</style></helmet>
<div style="display:flex;flex-direction:column;font-family:'Inter',system-ui,sans-serif;color:#1F2430">
  <div style="display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:0 0 8px;border-bottom:1px solid #E6E8EC;flex-wrap:wrap">
    <span style="font-size:14px;font-weight:600">{{ title }} <span style="font-weight:400;color:#8B91A0;font-family:'JetBrains Mono',monospace;font-variant-numeric:tabular-nums;font-size:12px">{{ countLabel }}</span></span>
    <span style="font-size:12px;color:#8B91A0">{{ summary }}</span>
  </div>
  <div data-wq-head style="display:grid;grid-template-columns:28px minmax(0,1fr) 160px 88px 110px 132px;gap:16px;padding:8px 0;border-bottom:1px solid #E6E8EC;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#8B91A0"><span>#</span><span>Work</span><span>Status</span><span style="text-align:right">{{ amountHead }}</span><span>Due</span><span></span></div>
  <sc-for list="{{ rows }}" as="r" hint-placeholder-count="4">
    <div data-wq-row onClick="{{ r.go }}" style="display:grid;grid-template-columns:28px minmax(0,1fr) 160px 88px 110px 132px;gap:8px 16px;align-items:center;padding:14px 0;border-bottom:1px solid #E6E8EC;cursor:pointer;background:{{ r.bg }};box-shadow:{{ r.shadow }}" style-hover="background:#F7F8FA">
      <span data-wq-n style="font-family:'JetBrains Mono',monospace;font-variant-numeric:tabular-nums;font-size:12px;color:{{ r.numFg }};font-weight:600;padding-left:8px">{{ r.n }}</span>
      <div data-wq-main style="display:flex;flex-direction:column;gap:3px;min-width:0">
        <span style="display:flex;align-items:center;gap:8px;flex-wrap:wrap"><span style="font-size:14px;font-weight:600;letter-spacing:-.01em;text-wrap:pretty">{{ r.title }}</span><sc-if value="{{ r.isNext }}" hint-placeholder-val="{{ false }}"><span style="font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:{{ accent }};white-space:nowrap">Next up</span></sc-if></span>
        <span style="font-size:12px;color:#5B6272;line-height:1.45;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical">{{ r.context }}</span>
      </div>
      <div data-wq-meta style="display:contents">
        <span style="display:flex;align-items:center;gap:8px;font-size:13px;color:#1F2430;white-space:nowrap"><span style="display:inline-block;width:6px;height:6px;border-radius:999px;flex-shrink:0;background:{{ r.statusColor }}"></span>{{ r.status }}</span>
        <span style="font-family:'JetBrains Mono',monospace;font-variant-numeric:tabular-nums;font-size:13px;font-weight:500;text-align:right;white-space:nowrap">{{ r.amount }}</span>
        <span style="display:flex;flex-direction:column;gap:1px;white-space:nowrap"><span style="font-size:13px;color:{{ r.dueFg }}">{{ r.due }}</span><span style="font-size:11px;color:#8B91A0">{{ r.dueSub }}</span></span>
      </div>
      <button data-wq-act onClick="{{ r.go }}" style="justify-self:end;border:0;cursor:pointer;height:32px;padding:0 14px;border-radius:999px;font-size:13px;font-weight:600;white-space:nowrap;color:{{ r.btnFg }};background:{{ r.btnBg }};box-shadow:inset 0 0 0 1px {{ r.btnBd }}" style-hover="opacity:.9">{{ r.action }}</button>
    </div>
  </sc-for>
  <sc-if value="{{ isEmpty }}" hint-placeholder-val="{{ false }}"><div style="padding:32px 0;font-size:13px;color:#8B91A0;border-bottom:1px solid #E6E8EC">{{ emptyText }}</div></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:960,&quot;height&quot;:420},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Your work today&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#1F2430&quot;,&quot;options&quot;:[&quot;#8A6B3F&quot;,&quot;#5B6FA3&quot;,&quot;#8A6B3F&quot;,&quot;#5B6FA3&quot;],&quot;tsType&quot;:&quot;string&quot;},&quot;amountHead&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Amount&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;highlightFirst&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;items&quot;:{&quot;editor&quot;:null,&quot;default&quot;:[],&quot;tsType&quot;:&quot;Array&lt;{title:string,context:string,status:string,statusColor:string,amount:string,value?:number,due:string,dueSub?:string,urgent?:boolean,action:string,go:()=&gt;void}&gt;&quot;},&quot;summary&quot;:{&quot;editor&quot;:null,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;emptyText&quot;:{&quot;editor&quot;:null,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals(){
    const p=this.props, accent=p.accent||'#1F2430', items=p.items||[];
    const rows=items.map((it,i)=>{ const next=i===0&&!!p.highlightFirst; return Object.assign({},it,{n:String(i+1).padStart(2,'0'),isNext:next,numFg:next?accent:'#8B91A0',bg:next?'#FAFAFB':'transparent',shadow:next?'inset 2px 0 0 '+accent:'none',
      dueFg:it.urgent?'#C2410C':'#1F2430',dueSub:it.dueSub||'',amount:it.amount||'—',
      btnBg:next?accent:'#FFFFFF',btnFg:next?'#FFFFFF':'#1F2430',btnBd:next?accent:'#E6E8EC'}); });
    const total=items.reduce((a,x)=>a+(x.value||0),0);
    return {rows,accent,title:p.title||'Your work today',countLabel:items.length?String(items.length):'',amountHead:p.amountHead||'Amount',
      summary:p.summary||(items.length?(total?'$'+total.toLocaleString('en-US')+' across '+items.length+' items':''):''),
      isEmpty:items.length===0,emptyText:p.emptyText||'Nothing in your queue right now.'};
  }
}
</script>
</body>
</html>
